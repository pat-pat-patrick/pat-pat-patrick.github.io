# patpatpatrick.com — static Jekyll site
# Install to: /etc/nginx/sites-available/patpatpatrick.com
# Enabled and reloaded by deploy/enable-https.sh

# Cache policy keyed on response content type, so no per-location add_header
# block is needed — a location-level add_header would replace the server-level
# security headers rather than add to them.
map $sent_http_content_type $site_cache_control {
    default                 "public, max-age=3600";
    text/html               "public, max-age=600";
    text/css                "public, max-age=2592000";
    application/javascript  "public, max-age=2592000";
    ~^image/                "public, max-age=2592000";
    ~font                   "public, max-age=2592000";
}

# One shared TLS session cache for both HTTPS server blocks below.
ssl_session_cache shared:SSL:10m;

# ---------------------------------------------------------------- HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name patpatpatrick.com www.patpatpatrick.com;

    # Keep ACME renewals working over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://patpatpatrick.com$request_uri;
    }
}

# --------------------------------------------------------- www -> apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.patpatpatrick.com;

    ssl_certificate     /etc/letsencrypt/live/patpatpatrick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patpatpatrick.com/privkey.pem;
    include             /etc/nginx/snippets/tls-params.conf;

    return 301 https://patpatpatrick.com$request_uri;
}

# ------------------------------------------------------------------- the site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name patpatpatrick.com;

    # Atomic deploys: `current` is a symlink that deploy.sh flips.
    root  /var/www/patpatpatrick.com/current;
    index index.html;

    ssl_certificate         /etc/letsencrypt/live/patpatpatrick.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/patpatpatrick.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/patpatpatrick.com/chain.pem;
    include                 /etc/nginx/snippets/tls-params.conf;
    ssl_stapling            on;
    ssl_stapling_verify     on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Cache-Control             $site_cache_control always;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  256;
    gzip_types       text/plain text/css text/xml application/javascript
                     application/json application/xml image/svg+xml;

    # Jekyll's `permalink: pretty` emits directories holding index.html;
    # $uri.html covers the flat pages (introduction.html, 404.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    access_log /var/log/nginx/patpatpatrick.access.log;
    error_log  /var/log/nginx/patpatpatrick.error.log;
}
